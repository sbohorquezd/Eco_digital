<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>ECO DIGITAL – Iniciar sesión</title>
</head>
<body>
<div class="wrap">
  <div class="auth">
    <div class="logo" style="margin-bottom:16px">ECO <span>DIGITAL</span></div>
    <div class="panel">
      <div class="tabs">
        <button type="button" id="tLogin" class="on">Iniciar sesión</button>
        <button type="button" id="tReg">Crear cuenta</button>
      </div>
      <h2 id="ttl">Bienvenida</h2>
      <p class="hint" id="sub">Ingresa con tu correo y contraseña.</p>
      <div id="rowNombre" hidden>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" autocomplete="name">
      </div>
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" autocomplete="email">
      <label for="pass">Contraseña</label>
      <input type="password" id="pass" autocomplete="current-password">
      <div class="err" id="err" role="alert"></div>
      <button id="go">Iniciar sesión</button>
    </div>
  </div>
</div>
<script src="login.js"></script>
</body>
</html>
