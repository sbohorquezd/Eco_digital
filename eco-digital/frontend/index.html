<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>ECO DIGITAL – Firma electrónica</title>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">ECO <span>DIGITAL</span></div>
  <div class="userbar"><span id="quien"></span><button id="salir">Cerrar sesión</button></div>
</header>
<div class="demo"><b>Versión de demostración.</b> El código se muestra en una bandeja simulada; no se envía ningún correo real.</div>
<div class="grid">
  <section class="panel" aria-live="polite">
    <ol class="steps" id="steps"><li>Documento</li><li>Firmante</li><li>Código</li><li>Firmado</li></ol>
    <div id="view"></div>
  </section>
  <section>
    <article class="paper" id="paper">
      <h3 id="pTitle"></h3>
      <p class="meta" id="pMeta"></p>
      <div id="pBody"></div>
      <div class="sig"><div id="sig"><span class="pending">Firma pendiente</span></div></div>
      <div class="stamp" id="stamp"></div>
    </article>
    <div class="saved" id="saved">Documentos firmados por ti: 0</div>
  </section>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
